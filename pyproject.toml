[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "anthropic==0.58.2",
    "sentence-transformers==5.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.5.0",
    "isort>=9.0.2",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls the real Anthropic API using the key in .env (deselect with -m 'not live')",
    "api: FastAPI endpoint tests against an in-memory test app",
]
filterwarnings = [
    "ignore:resource_tracker. There appear to be.*",
]

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '(backend/chroma_db|\.trees)'

[tool.isort]
profile = "black"
src_paths = ["backend"]
extend_skip = ["backend/chroma_db", ".trees"]
